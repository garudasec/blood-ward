<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- BloodWard Clinical Blood Drop Gradient -->
    <linearGradient id="blood-drop-grad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="35%" stop-color="#DC2626" />
      <stop offset="70%" stop-color="#A61B2B" />
      <stop offset="100%" stop-color="#7F1D1D" />
    </linearGradient>

    <!-- Liquid Gloss Highlight -->
    <linearGradient id="gloss-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Clean Standalone Blood Drop Silhouette on Transparent Background -->
  <path
    d="M256 32
       C256 32 108 212 108 332
       C108 418 174 480 256 480
       C338 480 404 418 404 332
       C404 212 256 32 256 32 Z"
    fill="url(#blood-drop-grad)"
  />

  <!-- Liquid Reflection Arc on Upper-Left Shoulder -->
  <path
    d="M256 72
       C256 72 144 220 144 316
       C144 346 156 374 176 394
       C160 372 154 346 154 322
       C154 242 246 98 246 98 Z"
    fill="url(#gloss-grad)"
  />
</svg>
